[Ollama]
# Host for the Ollama service
host = http://localhost:11434
# Default model to use with Ollama (e.g., phi3:mini, llama2)
model = phi3:mini
# Request timeout in seconds
timeout = 60

[App]
# Default interface to use if not specified (gradio, tkinter, auto)
default_interface = auto
# Default port for the Gradio web interface
default_port = 7860
# Enable or disable debug mode (True, False)
debug_mode = False

[Paths]
# Path to the local database file
database_file = data/medstudy.db
# Path to store documents for RAG
documents_path = data/documents/
# Path for application logs
log_file = logs/app.log

[Development]
# API key for future Gemini integration (leave blank if not used)
gemini_api_key =
# API key for future Anthropic/Claude integration (leave blank if not used)
anthropic_api_key =
